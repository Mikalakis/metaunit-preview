<!doctype html>
<html lang="en" data-theme="moon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>To Ty Casting · Closed</title>
<style>
:root{--bg:#000;--fg:#fff;--mute:#a6a6a6;--dim:#6d6d6d;--mint:#afefe6;--line:#2b2b2b;--accent:#7171fb;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:40px 20px 56px;font-family:var(--mono)}
.box{width:min(520px,100%);display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.top .moon{height:34px;width:auto;display:block}
.top .client{height:18px;width:auto;opacity:.85;display:block}
.tag{align-self:flex-start;background:var(--mint);color:#000;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:6px;transform:rotate(-3deg)}
.title{width:min(260px,62%);height:auto;display:block}
hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.done{width:100%;height:auto;display:block}
.thanks{width:min(400px,92%);height:auto;display:block}
.sign{display:block;margin:-6px 0 0 -6px;line-height:0}
.sign img{height:56px;width:auto;display:block}
@media (max-width:600px){.sign img{height:46px}}
.by{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:6px 0 0}
.by b{color:var(--fg);font-weight:400}
.pwr{position:fixed;right:10px;bottom:8px;display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-decoration:none;opacity:.7}
.pwr:hover{opacity:1}
.pwr img{height:10px;width:auto;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main class="box">
  <div class="top">
    <img class="moon" src="moon_logo.svg" alt="Moon Films">
    <img class="client" src="allegro.png" alt="">
  </div>
  <span class="tag">Casting closed</span>
  <img class="title" src="gate_title.svg" alt="To Ty Casting">
  <hr>
  <h1 class="sr">The casting stage is complete.</h1>
  <img class="done" src="closed_title.svg" alt="" aria-hidden="true">
  <p class="sr">Thank you, and good luck with the shoot.</p>
  <img class="thanks" src="closed_thanks.svg" alt="" aria-hidden="true">
  <a class="sign" href="https://metaunit.io"><img src="/assets/logo/metaunit_light.png" alt="metaUNIT"></a>
  <p class="by">Directed by <b>Kuba Michalczuk</b></p>
</main>
</body>
</html>
