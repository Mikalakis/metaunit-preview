<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><style>body{margin:0}</style></head><body><title>To Ty Casting Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500;62..125,700;62..125,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* metaBOARD v2. Everything board-specific (names, verdicts, switch, logos, texts, media sources) comes from the board config. */
:root{
  --bg:#0f0f10; --panel:#18181a; --panel2:#202023; --line:#2c2c30;
  --fg:#f3f1ee; --mute:#9a9893; --dim:#6c6a66;
  --accent:#ff5a00; --trade:#f2ece4; --kill:#ff5e57; --g:#34c759;
  --ar:4/5; --minw:150px; --minw-m:130px;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:clamp(16px,3vw,40px);padding-block:0 40px}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:1em;height:1em;vertical-align:-.12em;flex:none}

/* gate */
html:not(.open) .bar,html:not(.open) main,html:not(.open) footer{display:none!important}
html.open #gate{display:none}
#gate{min-height:100vh;display:grid;place-items:center;padding-block:40px}
.gbox{width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.gbox h1{font-family:var(--display);font-stretch:118%;font-weight:800;font-size:clamp(34px,7vw,48px);line-height:.95;text-transform:uppercase;margin:6px 0 0}
.gbox .by{font-size:14px;color:var(--fg);margin:0 0 6px}
.gbox .by b{font-weight:600}
.gbox p{color:var(--mute);margin:0;font-size:14px}
.gbox input,.field{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:inherit;font-size:16px;width:100%}
.gbox input#pw{font-family:var(--mono);letter-spacing:.08em}
.gbox input:focus,.field:focus{border-color:var(--accent);outline:none}
.err{color:var(--kill);font-size:13px;min-height:18px}
.gbox .logos{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px}
.gbox .logos img{height:22px;width:auto}

/* slate bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);margin-inline:calc(-1*clamp(16px,3vw,40px));padding:12px clamp(16px,3vw,40px);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:22px;letter-spacing:.01em;margin:0;text-transform:uppercase;line-height:1.1}
.brand span{font-family:var(--mono);font-size:11px;color:var(--mute)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{background:none;border:0;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--mute);letter-spacing:.02em}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.seg button b{font-family:var(--mono);margin-left:4px;font-weight:700}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.me button{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--fg);font-weight:600;font-size:13px}
.me input{width:150px;padding:6px 10px;font-size:13px}
.logo-a{height:22px;width:auto}
.row2{display:flex;gap:6px;flex-wrap:nowrap;width:100%;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;align-items:center}
.row2:empty{display:none}
.row2 a,.row2 button.t{font-family:var(--mono);font-size:11px;text-decoration:none;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:3px 7px;white-space:nowrap;background:none;cursor:pointer}
.row2 a:hover{color:var(--fg);border-color:var(--mute)}
.row2 button.t{color:var(--trade);font-weight:700}
.row2 button.t[aria-pressed=true]{background:var(--trade);color:var(--bg);border-color:var(--trade)}
.row2 .sep{color:var(--dim);font-size:11px;font-family:var(--mono);padding:0 4px;white-space:nowrap}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:10.5px;color:var(--dim);padding-block:16px 2px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend .v{display:inline-flex;gap:5px;align-items:center;color:var(--fg);font-size:13.5px;font-weight:700;letter-spacing:.02em}
.legend .v .i{width:15px;height:15px}
.legend i{width:8px;height:8px}
#vRoles>.note{font-size:11px;line-height:1.45;color:var(--dim);margin-block:6px}
#segCamp button{color:var(--sc,var(--mute))}
#segCamp button[aria-pressed=true]{background:var(--sc,var(--fg));color:#111}
#tReco{color:var(--rc,var(--fg));box-shadow:inset 0 0 0 1.5px var(--rc,var(--fg))}
#tReco[aria-pressed=true]{background:var(--rc,var(--fg));color:#111;box-shadow:none}
.note{font-size:12.5px;color:var(--mute);max-width:70ch}

.fam{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(28px,5vw,52px);text-transform:uppercase;letter-spacing:.01em;margin:56px 0 4px;line-height:1}
.fam small{display:block;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--accent);margin-bottom:10px}

.role{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,360px);gap:24px;padding-block:28px;border-top:1px solid var(--line);scroll-margin-top:130px}
.role.noside{grid-template-columns:minmax(0,1fr)}
.role-head{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.role-head h2{font-family:var(--display);font-weight:700;font-size:30px;margin:0;line-height:1.1;text-wrap:balance}
.role-head .desc{font-size:20px;color:var(--mute)}
.role-head .age{font-family:var(--mono);font-size:12px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);border-radius:5px;padding:2px 7px}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.lab.t{color:var(--trade)}
.scenes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scenes.one{grid-template-columns:1fr}
.scene img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;display:block;background:var(--panel)}
.scene div{font-size:12px;margin-top:5px}
.scene b{font-family:var(--mono);font-size:11px;color:var(--mute);font-weight:500;margin-right:6px}
.script{font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0;max-height:min(60vh,520px);overflow:auto;color:#dcd9d4}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--mono);font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;background:var(--trade);color:var(--bg);border:1.5px solid var(--trade)}
.pill.bg{background:none;color:var(--trade)}
.pill.hit{box-shadow:0 0 0 2px var(--accent)}
.chg{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.chg select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;width:100%}
.chg .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chg button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.chg button:disabled{opacity:.4;cursor:default}
.chg button.go:not(:disabled){background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chg button.del{background:none;color:var(--kill);border-color:color-mix(in srgb,var(--kill) 45%,transparent)}
.chg button.del.arm{background:var(--kill);color:var(--bg)}
.chg .in{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--mute);align-items:center}
.chg .in a{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;cursor:pointer;color:var(--fg)}
.chg .in a.here{border-color:var(--accent);color:var(--accent)}
.chg .by{font-size:11.5px;color:var(--dim)}
.face[draggable=true]{cursor:grab}
.role.drop{outline:2px dashed var(--accent);outline-offset:6px;border-radius:10px}
.face .added{position:absolute;left:8px;bottom:46px;font-family:var(--mono);font-size:10px;background:var(--accent);color:#fff;border-radius:4px;padding:1px 5px;z-index:2}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:14px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
.toast button{background:none;border:0;color:var(--accent);font:inherit;font-weight:800;cursor:pointer}
.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--minw),1fr));gap:12px;align-content:start;min-width:0}
.empty{font-family:var(--display);font-weight:700;font-size:26px;color:var(--dim);padding:40px 0}
.empty.love{color:var(--accent)}

.face{position:relative;border:0;padding:0;background:var(--panel);border-radius:8px;overflow:hidden;cursor:pointer;text-align:left;aspect-ratio:var(--ar);display:block;width:100%}
.face img.p{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease,filter .3s}
.face:hover img.p{transform:scale(1.04)}
.face.killed img.p{filter:grayscale(1) brightness(.55)}
.face.reco{box-shadow:0 0 0 4px var(--ring,#f5c542)}
.face.reco .shade{background:linear-gradient(transparent,color-mix(in srgb,var(--ring,#f5c542) 95%,transparent) 60%)}
.face.reco .nm,.face.reco .tg{color:#1a1400}
.face.bk{box-shadow:0 0 0 2px var(--ring2,#c9cdd4)}
.face.bk .shade{background:linear-gradient(transparent,color-mix(in srgb,var(--ring2,#c9cdd4) 92%,transparent) 60%)}
.face.bk .nm,.face.bk .tg{color:#15171a}
.face.nov img.p{opacity:.55}
.face.nov:hover img.p{opacity:1}
.face .shade{position:absolute;inset:auto 0 0 0;padding:34px 10px 9px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.face .nm{font-weight:600;font-size:14px;line-height:1.2;color:#fff}
.face .tg{font-size:11px;color:#cfccc6;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face .top{position:absolute;top:8px;left:8px;display:flex;align-items:center;gap:6px}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid #fff;flex:none;display:inline-block}
.src{font-family:var(--mono);font-size:10px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;border-radius:4px;padding:1px 5px}
.play{position:absolute;top:50%;left:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;opacity:0;transition:opacity .2s}
.face:hover .play,.face:focus-visible .play{opacity:1}
.play::before{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.votes{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.vrow{display:flex;gap:2px;background:rgba(0,0,0,.62);border-radius:999px;padding:4px 8px;font-size:22px;line-height:1;align-items:center}
.vrow span{font-family:var(--mono);font-size:13px;font-weight:700;margin-left:3px;color:#fff}
@media (max-width:600px){.vrow{font-size:17px;padding:3px 6px}}

/* votes view */
.prow{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;padding-block:18px;border-top:1px solid var(--line)}
.prow h3{font-family:var(--display);font-weight:700;font-size:20px;margin:0}
.prow h3 small{display:block;font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:500;letter-spacing:.08em;margin-bottom:4px}
.pcands{display:flex;flex-direction:column;gap:10px;min-width:0}
.pc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--panel);border-radius:8px;padding:8px;cursor:pointer;border:0;text-align:left;width:100%}
.pc img.p{height:70px;width:auto;aspect-ratio:var(--ar);object-fit:cover;border-radius:5px;max-width:124px}
.pc .nm{font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.who{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.wh{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.wh .ic{font-size:15px;line-height:1.2}
.wh b{font-weight:600}
.wh q{color:var(--mute);quotes:none;display:block}
.wh time{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:6px}
.wh .rm{background:none;border:0;color:var(--dim);font-size:11px;cursor:pointer;text-decoration:underline;padding:0;margin-left:6px}
.none{color:var(--dim);font-size:13px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(5,5,6,.92);display:grid;place-items:center;padding:clamp(8px,3vw,32px)}
.box{width:min(1300px,100%);max-height:100%;display:grid;grid-template-columns:minmax(0,1fr) 360px;background:var(--panel);border-radius:12px;overflow:hidden}
.stage{background:#000;display:flex;align-items:center;justify-content:center;min-height:240px;position:relative}
.stage video{width:100%;max-height:calc(100vh - 80px);display:block;background:#000}
.stage iframe{width:100%;aspect-ratio:16/9;max-height:calc(100vh - 80px);border:0;display:block;background:#000}
.stage img#still{max-width:100%;max-height:calc(100vh - 80px);display:block}
#loading{position:absolute;color:#fff;font-family:var(--mono);font-size:13px;text-align:center;padding:0 60px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:56px;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:22px;cursor:pointer;border-radius:6px;z-index:2}
.nav.l{left:8px}.nav.r{right:8px}
.panel{padding:20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:calc(100vh - 64px);min-width:0}
.panel .x{align-self:flex-end;border:0;background:var(--panel2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;margin:-6px -6px -10px 0}
.panel h3{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;margin:0}
.idesc{font-size:13.5px;color:#dcd9d4;white-space:pre-wrap;margin:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.forrole{font-size:13px;color:var(--mute)}
.forrole b{color:var(--fg)}
.verd{display:grid;grid-template-columns:repeat(var(--nv,3),1fr);gap:6px}
.verd button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel2);cursor:pointer;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--vc);text-align:center}
.verd button svg{width:22px;height:22px}
.verd button[aria-pressed=true]{background:var(--vc);color:var(--vink,#111);border-color:var(--vc)}
.flab{font-family:var(--mono);font-size:11px;color:var(--dim);display:flex;justify-content:space-between}
.flab em{font-style:normal;color:var(--accent)}
textarea{width:100%;min-height:64px;resize:vertical;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);text-decoration:none}
.btn.send{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.saved{font-size:12px;min-height:16px;color:var(--g)}
.saved.bad{color:var(--kill)}
.also{font-size:12px;color:var(--mute)}
.also a{color:var(--fg);cursor:pointer;text-decoration:underline;text-decoration-color:var(--dim)}
.hint{font-family:var(--mono);font-size:11px;color:var(--dim)}
footer{display:flex;align-items:center;gap:16px;margin-top:64px;padding-top:20px;border-top:1px solid var(--line);color:var(--dim);font-size:12px;flex-wrap:wrap}
footer img{height:26px;width:auto}
footer b{color:var(--fg);font-weight:600}

/* scenes layout */
.scn{border-top:1px solid var(--line);padding-block:34px 10px;scroll-margin-top:130px}
.scn-head{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:end;margin-bottom:6px}
.scn-head img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block;background:var(--panel)}
.scn-head .code{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--accent);display:block;margin-bottom:6px}
.scn-head h2{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:clamp(26px,3.6vw,40px);line-height:1;margin:0;text-transform:uppercase}
.scn-head .roles-in{font-size:13px;color:var(--mute);margin-top:8px}
.scn-head.noimg{grid-template-columns:1fr}
.srow{display:block;padding-block:18px 8px;border-top:1px dashed var(--line);scroll-margin-top:130px}
.srow:first-of-type{border-top:0}
.srow .role-head{margin-bottom:12px}
.srow .role-head h2{font-size:22px}
.srow .bgtag{font-family:var(--mono);font-size:11px;color:var(--trade);border:1px solid var(--trade);border-radius:5px;padding:1px 6px}
.srow .rnote{font-size:12.5px;color:var(--mute);margin:-6px 0 10px}
/* reco view */
.rtools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:18px 0}
.rtools button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--fg)}
.rtools button[aria-pressed=true]{background:var(--silver,#c9cdd4);color:#15171a;border-color:#c9cdd4}
.rcard{border-top:1px solid var(--line);padding-block:26px 10px}
.rcard .scn-head{margin-bottom:16px;grid-template-columns:minmax(0,220px) minmax(0,1fr)}
.rcols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,190px);justify-content:start;gap:14px;overflow-x:auto;padding-bottom:6px}
.rcol{background:var(--panel);border-radius:10px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.rcol h4{margin:0;font-family:var(--display);font-weight:700;font-size:15px;line-height:1.15}
.rcol h4 small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--mute)}
.rtier{display:flex;flex-direction:column;gap:8px}
.rtier.sv{border-top:1px dashed var(--line);padding-top:8px}
.rp{position:relative;border:0;padding:0;background:#000;border-radius:7px;overflow:hidden;cursor:pointer;aspect-ratio:var(--ar);width:100%;display:block;text-align:left}
.rp img{width:100%;height:100%;object-fit:cover;display:block}
.rp .shade{position:absolute;inset:auto 0 0 0;padding:26px 8px 7px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.rp .nm{font-weight:600;font-size:13px;color:#fff;line-height:1.15}
.rp .cnt{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.62);border-radius:999px;padding:2px 7px;font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;display:flex;gap:3px;align-items:center}
.rp.reco{box-shadow:0 0 0 3px var(--ring,#f5c542)}
.rp.top1{box-shadow:0 0 0 5px var(--ring,#f5c542)}
.rp.reco .shade{background:linear-gradient(transparent,color-mix(in srgb,var(--ring,#f5c542) 95%,transparent) 60%)}

function toast(t,undo){ $("#toastT").textContent=t; $("#toastU").hidden=!undo; $("#toastU").onclick=async()=>{$("#toast").hidden=true;try{await undo();await load(true)}catch(e){toast(T.undo_fail)}};
  $("#toast").hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>$("#toast").hidden=true,7000)}
async function moveTo(from,to,ck,follow){ const c=C[ck];
  if(R[to].items.includes(ck)){toast(fmt(T.already_in,{n:c.nm,s:nmR(to)}));return}
  try{ await rset(to,ck,"add"); await rset(from,ck,"del"); await moveVotes(from,to,ck); await load(true);
    toast(fmt(T.moved,{n:c.nm,s:nmR(to)}),async()=>{await rset(from,ck,"add");await rset(to,ck,"del");await moveVotes(to,from,ck)});
    if(follow&&cur)openLB(to,R[to].items.indexOf(ck)) }
  catch(e){toast(T.save_fail)}}
async function addTo(to,ck,follow){ const c=C[ck];
  if(R[to].items.includes(ck)){toast(fmt(T.already_in,{n:c.nm,s:nmR(to)}));return}
  try{ await rset(to,ck,"add"); await load(true); toast(fmt(T.added_to,{n:c.nm,s:nmR(to)}),async()=>{await rset(to,ck,"del")}); if(follow&&cur)openLB(to,R[to].items.indexOf(ck)) }
  catch(e){toast(T.save_fail)}}
async function removeFrom(rid,ck){ const c=C[ck];
  try{ await rset(rid,ck,"del"); await load(true); toast(fmt(T.removed_from,{n:c.nm,s:nmR(rid)}),async()=>{await rset(rid,ck,"add")}) }
  catch(e){toast(T.save_fail)}}
async function load(force){
  try{const d=await rpc("mb_load",{}); const rows=d.votes||[], ros=d.roster||[];
    const sig=JSON.stringify([rows,ros]); if(sig===lastSig&&!force)return; lastSig=sig; VOTES=(D.snap||[]).concat(rows); ROSTER=ros; applyRoster();
    $("#status").textContent=fmt(T.status_ok,{verdicts:VERD.map(v=>v.label).join(" / ")}); renderAll()}
  catch(e){$("#status").textContent=T.status_err}
}
/* ---------- header ---------- */
function renderMe(){
  const m=$("#me"); m.replaceChildren(el("span",{text:T.you}));
  const b=el("button",{text:myName||T.set_name,title:T.change_name,onclick:()=>{
    const i=el("input",{class:"field",id:"meName",value:myName,maxlength:"40","aria-label":T.your_name});
    const done=()=>{const v=i.value.trim(); if(v){myName=v;LS.set(K_NAME,v)} renderMe(); fillLB()};
    i.addEventListener("keydown",e=>{if(e.key==="Enter")done();if(e.key==="Escape")renderMe()}); i.addEventListener("blur",done);
    m.replaceChildren(el("span",{text:T.you}),i); i.focus(); i.select()}});
  m.append(b);
}
function setView(v){if(CLIENT)v="reco";view=v;$("#tRoles").setAttribute("aria-pressed",String(v==="roles"));$("#tVotes").setAttribute("aria-pressed",String(v==="votes"));$("#vRoles").hidden=v!=="roles";$("#vVotes").hidden=v!=="votes";$("#vReco").hidden=v!=="reco";$("#tReco").setAttribute("aria-pressed",String(v==="reco"));$("#vStats").hidden=v!=="stats";if(v==="stats")loadStats();else if(location.hash==="#stats"||location.hash==="#statystyki")history.replaceState(null,"",location.pathname+location.search);statsBtn();renderAll();scrollTo(0,0)}
const K_ADM="mb:admin";
/* ---------- presence ping (time on board) ---------- */
const SESSION=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36));
let visSince=document.hidden?null:Date.now(), acc=0;
function takeSeconds(){ if(visSince){acc+=(Date.now()-visSince)/1000; visSince=document.hidden?null:Date.now()} const s=Math.floor(acc); acc-=s; return s }
function ping(keep){ const s=takeSeconds(); rpc("mb_ping",{p_session:SESSION,p_name:myName||"?",p_device:DEVICE,p_seconds:Math.min(s,120),p_ua:navigator.userAgent.slice(0,200)},keep?{keepalive:true}:null).catch(()=>{}) }
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ping(true);visSince=null} else visSince=Date.now() });
addEventListener("pagehide",()=>ping(true));
ping(); setInterval(()=>{if(!document.hidden)ping()},30000);
/* ---------- stats (admin only) ---------- */
const fmtDur=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+" h "+String(m).padStart(2,"0")+" min":m?m+" min":s+" s"};
const fmtWhen=t=>{const d=new Date(t);return d.toLocaleDateString(D.lang==="en"?"en-GB":"pl-PL",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString(D.lang==="en"?"en-GB":"pl-PL",{hour:"2-digit",minute:"2-digit"})};
const uaShort=u=>{u=u||"";const os=/iPhone/.test(u)?"iPhone":/iPad/.test(u)?"iPad":/Android/.test(u)?"Android":/Mac OS X/.test(u)?"Mac":/Windows/.test(u)?"Windows":/Linux/.test(u)?"Linux":"?";
  const br=/Edg\//.test(u)?"Edge":/CriOS|Chrome\//.test(u)?"Chrome":/FxiOS|Firefox\//.test(u)?"Firefox":/Safari\//.test(u)?"Safari":"";return os+(br?" · "+br:"")};
const TEAM=(D.team||[]).map(slug);
const known=n=>!TEAM.length||TEAM.some(t=>slug(n).startsWith(t)||t.startsWith(slug(n)));
async function loadStats(){
  const box=$("#stats"); const pw=LS.get(K_ADM);
  if(!pw){ const i=el("input",{class:"field",type:"password",placeholder:T.admin_pw,"aria-label":T.admin_pw});
    const go=el("button",{class:"btn send",text:T.enter,onclick:async()=>{LS.set(K_ADM,i.value.trim());await loadStats();statsBtn();}});
    i.addEventListener("keydown",e=>{if(e.key==="Enter")go.click()});
    box.replaceChildren(el("div",{class:"st-login"},i,go)); i.focus(); return }
  box.replaceChildren(el("p",{class:"note",style:"padding-top:18px",text:T.loading_votes}));
  let d; try{d=await rpc("mb_stats",{p_admin:pw})}catch(e){ const auth=/ 40[13]$/.test(String(e.message)); if(auth){try{localStorage.removeItem(K_ADM)}catch(_){};statsBtn()}
    box.replaceChildren(el("p",{class:"note",style:"padding-top:18px;color:var(--kill)",text:auth?T.admin_bad:T.status_err})); if(auth)setTimeout(()=>{if(view==="stats")loadStats()},1800); return }
  const vis=d.visits||[], by={};
  vis.forEach(v=>{const k=slug(v.name||"?"); const g=by[k]||(by[k]={name:v.name||"?",sec:0,ses:0,dev:new Set(),ip:new Set(),ua:new Set(),first:v.started_at,last:v.last_seen});
    g.sec+=v.seconds; g.ses++; if(v.device)g.dev.add(v.device); if(v.ip)g.ip.add(v.ip); g.ua.add(uaShort(v.ua));
    if(v.started_at<g.first)g.first=v.started_at; if(v.last_seen>g.last)g.last=v.last_seen});
  const vc={}; VOTES.forEach(v=>{const k=slug(v.voter||"");vc[k]=(vc[k]||0)+1});
  const rows=Object.entries(by).sort((a,b)=>b[1].sec-a[1].sec);
  const tot=vis.reduce((a,v)=>a+v.seconds,0);
  const sum=el("div",{class:"st-sum"},
    el("div",{},el("b",{text:rows.length}),el("span",{text:T.st_people})),
    el("div",{},el("b",{text:vis.length}),el("span",{text:T.st_sessions})),
    el("div",{},el("b",{text:fmtDur(tot)}),el("span",{text:T.st_total})),
    el("div",{},el("b",{text:rows.filter(([k,g])=>!known(g.name)).length}),el("span",{text:T.st_unknown})));
  const t=el("table",{class:"st"}); t.append(el("thead",{},el("tr",{},...[T.st_nick,T.st_time,T.st_sessions,T.st_votes,T.st_first,T.st_last,T.st_devices,"IP"].map(h=>el("th",{text:h})))));
  const tb=el("tbody"); rows.forEach(([k,g])=>{const unk=!known(g.name);
    tb.append(el("tr",{class:unk?"unk":null},el("td",{},el("b",{text:g.name}),unk?el("span",{class:"tagu",text:T.st_unknown_tag}):null),
      el("td",{class:"n",text:fmtDur(g.sec)}),el("td",{class:"n",text:g.ses}),el("td",{class:"n",text:vc[k]||0}),
      el("td",{class:"n",text:fmtWhen(g.first)}),el("td",{class:"n",text:fmtWhen(g.last)}),
      el("td",{text:[...g.ua].join(", ")+(g.dev.size>1?" ("+g.dev.size+")":"")}),el("td",{class:"n",text:[...g.ip].join(", ")})))});
  t.append(tb);
  const t2=el("table",{class:"st"}); t2.append(el("thead",{},el("tr",{},...[T.st_nick,T.st_start,T.st_time,T.st_devices,"IP"].map(h=>el("th",{text:h})))));
  const tb2=el("tbody"); vis.slice(0,100).forEach(v=>tb2.append(el("tr",{class:known(v.name||"?")?null:"unk"},el("td",{},el("b",{text:v.name||"?"})),el("td",{class:"n",text:fmtWhen(v.started_at)}),el("td",{class:"n",text:fmtDur(v.seconds)}),el("td",{text:uaShort(v.ua)}),el("td",{class:"n",text:v.ip||""}))));
  t2.append(tb2);
  box.replaceChildren(sum,el("p",{class:"note",text:T.stats_note2}),el("div",{class:"st-wrap"},t),el("div",{class:"lab",style:"margin-top:36px",text:T.st_log}),el("div",{class:"st-wrap"},t2),
    el("p",{class:"note",style:"margin-top:18px"},el("button",{class:"foot-admin",style:"margin:0",text:T.admin_logout,onclick:()=>{try{localStorage.removeItem(K_ADM)}catch(_){};statsBtn();setView("roles")}})));
}
$("#tRoles").onclick=()=>setView("roles"); $("#tVotes").onclick=()=>setView("votes");
if(SCENES&&TOPV.length){$("#tReco").hidden=false;$("#tReco").textContent="★ "+T.reco_tab;$("#tReco").style.setProperty("--rc",VMAP[TOPV[0]].color);$("#tReco").onclick=()=>setView("reco")}
function statsBtn(){ let b=$("#tStats"); if(!CLIENT&&LS.get(K_ADM)){ if(!b){b=el("button",{id:"tStats","aria-pressed":"false",text:T.stats_tab,onclick:()=>setView("stats")});$("#segView").append(b)} b.setAttribute("aria-pressed",String(view==="stats")) } else if(b) b.remove() }
const goHash=()=>{ if(!CLIENT&&location.hash==="#stats"||location.hash==="#statystyki") setView("stats") };
addEventListener("hashchange",goHash); statsBtn(); setTimeout(goHash,0);

function renderAll(){renderCamp();renderRow2();renderRoles();renderVotes();if(view==="reco")renderReco();fillLB()}
if(CLIENT){ document.documentElement.classList.add("client"); view="reco"; $("#vRoles").hidden=true; $("#vReco").hidden=false; $("#tReco").setAttribute("aria-pressed","true") }
applyRoster(); renderMe(); renderAll();

load(); setInterval(()=>{if(!document.hidden)load()},8000); document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
}
