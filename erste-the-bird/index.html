<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">

<title>The Bird · metaUNIT</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/img/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap">
<style>
:root{--bg:#08080a;--bg2:#0d0e11;--card:#101116;--ink:#ececed;--dim:#9a9ba1;--faint:#86878d;
--hair:rgba(255,255,255,.08);--hair2:rgba(255,255,255,.15);--acc:#e0a63c;--max:1300px;--pad:48px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}img,video{display:block;max-width:100%}
::selection{background:var(--acc);color:#000}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
@media(max-width:700px){:root{--pad:16px}}
.lab{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);display:inline-flex;align-items:center;gap:12px}
.lab::before{content:"";width:22px;height:1px;background:var(--acc);flex:none}

/* GATE */
#gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:40px 16px;position:relative;overflow:hidden}
#gate::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 0%,rgba(224,166,60,.08),transparent 60%)}
html.open #gate{display:none}
.gbox{position:relative;width:min(440px,100%);display:flex;flex-direction:column;gap:18px}
.glogo{height:26px;width:auto;margin-bottom:26px}
.gbox h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(46px,9vw,72px);line-height:.92;letter-spacing:-.045em;color:#fff}
.gbox h1 .d{color:var(--acc)}
.gsub{font-size:14px;color:var(--dim);font-weight:300;line-height:1.55;margin-bottom:10px}
.gbox label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.gbox input{background:var(--bg2);border:1px solid var(--hair2);border-radius:2px;color:#fff;font:500 16px 'Space Mono',monospace;padding:14px 16px;letter-spacing:.08em;outline:none;transition:.3s}
.gbox input:focus{border-color:var(--acc)}
.gbox button{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:15px 18px;border:1px solid var(--ink);background:var(--ink);color:#000;border-radius:2px;cursor:pointer;transition:.3s}
.gbox button:hover{background:var(--acc);border-color:var(--acc)}
.gbox button[disabled]{opacity:.5;cursor:wait}
.gerr{min-height:18px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;color:#ff8a7a}
.gfoot{margin-top:20px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
#app{display:none}html.open #app{display:block}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);background:rgba(8,8,10,.6);border-bottom:1px solid var(--hair)}
.nav-in{display:flex;align-items:center;justify-content:space-between;max-width:var(--max);margin:0 auto;padding:17px var(--pad);gap:24px}
.nav .logo img{height:19px;width:auto}
.nav-links{display:flex;gap:30px;font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.nav-links a:hover{color:var(--ink)}
.nav-tag{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--hair2);border-radius:2px;color:var(--acc);white-space:nowrap}
@media(max-width:900px){.nav-links{display:none}}
@media(max-width:480px){.nav-tag{font-size:8.5px;padding:7px 9px}.nav .logo img{height:15px}}

/* HERO */
.hero{position:relative;padding:190px 0 60px;background:radial-gradient(80% 60% at 85% 10%,rgba(91,140,220,.10),transparent 60%),var(--bg)}
.hero .lab{margin-bottom:26px;color:#cfc9bd}
.hero h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(64px,13vw,210px);line-height:.88;letter-spacing:-.05em;color:#fff;margin-bottom:30px}
.hero h1 .d{color:var(--acc)}
.hero-sub{font-size:clamp(15px,1.5vw,18px);font-weight:300;color:#cfcfd2;max-width:600px;line-height:1.55;margin-bottom:56px;text-wrap:balance}
.specbar{border-top:1px solid var(--hair2);display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding-top:22px}
.spec .k{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.spec .v{font-weight:500;font-size:13.5px;color:var(--ink);line-height:1.35}
@media(max-width:760px){.specbar{grid-template-columns:1fr 1fr;gap:20px}}

section{padding:110px 0;position:relative}
section.featured{padding:10px 0 90px}
.bg2{background:var(--bg2);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:40px}
.shead h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(30px,4.4vw,56px);line-height:1;letter-spacing:-.03em;max-width:16ch}
.shead h2 em{font-style:normal;color:var(--dim)}
.shead .rt{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);max-width:320px;text-align:right;line-height:1.7}
@media(max-width:820px){.shead{flex-direction:column;align-items:flex-start}.shead .rt{text-align:left}}

/* POSITIONING */
.posband{border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);background:var(--bg2);padding:88px 0}
.pos-top{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:26px}
.pos-tag{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.posband p.small{font-size:clamp(15px,1.55vw,18px);color:var(--dim);line-height:1.6;margin:0 0 22px;max-width:860px;font-weight:300}
.posband p.small b{color:var(--ink);font-weight:500}
.posband p.key{margin-top:34px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(28px,4vw,44px);line-height:1.02;letter-spacing:-.03em}
.posband p.key em{font-style:normal;color:var(--acc)}

/* FILMS */
.films{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.film{position:relative;overflow:hidden;border:1px solid var(--hair);border-radius:5px;background:#0d0e11;aspect-ratio:16/9;cursor:pointer;transition:border-color .3s}
.film:hover{border-color:var(--hair2)}
.film.w12{grid-column:span 12}.film.w6{grid-column:span 6}.film.w4{grid-column:span 4}
.film video,.film .pf{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.6,.2,1),opacity .6s}
.film video{opacity:0}.film video.on{opacity:1}
.film:hover video{transform:scale(1.03)}
.film::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,transparent 28%,transparent 50%,rgba(0,0,0,.9) 100%);pointer-events:none;z-index:2}
.film .finfo{position:absolute;left:20px;right:20px;bottom:17px;z-index:3}
.film .finfo h3{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:19px;letter-spacing:-.015em;color:#fff;line-height:1.1}
.film .finfo p{font-size:13px;color:#c4c4c8;line-height:1.45;margin-top:6px;max-width:46ch;font-weight:300}
.film.w12 .finfo h3{font-size:clamp(22px,3vw,32px)}
.dimw{color:var(--dim);font-weight:400}
.film .num{display:block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--acc);margin-bottom:6px}
.film .cred{margin-top:8px;display:flex;flex-wrap:wrap;gap:14px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.film .cred b{color:var(--faint);font-weight:400;margin-right:5px}
.film .watch{position:absolute;top:15px;right:16px;z-index:3;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);padding:6px 10px;border-radius:2px;opacity:0;transition:.3s}
.film:hover .watch{opacity:1}
.film .feat,.film .draft{position:absolute;top:15px;left:20px;z-index:3;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.film .draft{color:#cfcfd2;background:rgba(0,0,0,.45);padding:5px 9px;border-radius:2px;letter-spacing:.12em}
.film.loading::before{content:"";position:absolute;left:0;bottom:0;height:2px;width:30%;background:var(--acc);z-index:4;animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{left:-30%}100%{left:100%}}
@media(max-width:1000px){.film.w4{grid-column:span 6}}
@media(max-width:700px){.film.w6,.film.w4{grid-column:span 12}.film .finfo p{display:none}}

.checks{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:5px;overflow:hidden;margin-top:40px}
.ck{background:var(--bg);padding:28px 24px}
.ck .n{font-family:'Space Mono',monospace;font-size:12px;color:var(--acc)}
.ck h4{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px;letter-spacing:-.015em;margin:14px 0 8px;line-height:1.15}
.ck p{font-size:13.5px;color:var(--dim);line-height:1.55}
@media(max-width:900px){.checks{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.checks{grid-template-columns:1fr}}

/* ASSETS */
.agrid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.ai{position:relative;border:1px solid var(--hair);border-radius:5px;overflow:hidden;background:#0d0e11;aspect-ratio:16/10}
.ai.w7{grid-column:span 7}.ai.w5{grid-column:span 5}.ai.w4{grid-column:span 4}
.ai img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s,transform 1.2s cubic-bezier(.2,.6,.2,1)}
.ai img.on{opacity:1}.ai:hover img{transform:scale(1.03)}
.ai figcaption{position:absolute;left:14px;bottom:12px;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);padding:5px 9px;border-radius:2px}
.note{margin-top:30px;color:var(--dim);font-size:15px;max-width:760px;font-weight:300;line-height:1.6;border-left:1px solid var(--acc);padding-left:18px}
@media(max-width:800px){.ai.w7,.ai.w5,.ai.w4{grid-column:span 12}}

/* CLIMAX */
.climax{overflow:hidden;background:#000;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:140px 0}
.climax .bg{position:absolute;inset:0;background:radial-gradient(60% 70% at 15% 30%,rgba(224,166,60,.09),transparent 60%),radial-gradient(50% 60% at 90% 90%,rgba(91,140,220,.08),transparent 60%)}
.climax .in{position:relative;z-index:2}
.climax h3{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(28px,3.9vw,50px);line-height:1.1;letter-spacing:-.03em;color:#fff;margin:22px 0 30px;max-width:22ch}
.climax h3 em{font-style:normal;color:var(--acc)}
.climax p{color:#c9c9cd;font-size:17px;line-height:1.65;max-width:740px;font-weight:300;margin-bottom:18px}
.climax .tagline{margin-top:44px;font-family:'Space Mono',monospace;font-size:clamp(11px,1.1vw,14px);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--acc)}

/* PROCESS */
.prin{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:5px;overflow:hidden}
.pr{background:var(--bg);padding:36px 30px;min-height:220px;transition:.3s}
.pr:hover{background:var(--card)}
.pr .n{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--acc);margin-bottom:24px;text-transform:uppercase}
.pr h4{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:21px;letter-spacing:-.02em;margin:0 0 12px;line-height:1.12}
.pr p{font-size:14px;color:var(--dim);line-height:1.55}
@media(max-width:900px){.prin{grid-template-columns:1fr}}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:34px}
.st{border-top:1px solid var(--hair2);padding-top:16px;display:flex;flex-direction:column;gap:6px}
.st b{font-family:'Space Mono',monospace;font-size:11px;color:var(--acc);font-weight:400}
.st span{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;letter-spacing:-.01em}
.st i{font-style:normal;font-size:12.5px;color:var(--faint);line-height:1.45}
@media(max-width:900px){.steps{grid-template-columns:repeat(3,1fr);row-gap:24px}}
@media(max-width:520px){.steps{grid-template-columns:1fr 1fr}}

/* MANI */
.mani-lead{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(28px,4vw,50px);line-height:1.08;letter-spacing:-.03em;max-width:24ch;margin:22px 0 24px}
.mani-lead em{font-style:normal;color:var(--acc)}
.mani-sub{color:var(--dim);font-size:17px;max-width:700px;line-height:1.6;font-weight:300}

/* DIRECTOR */
.dir{display:grid;grid-template-columns:1fr 1.2fr;gap:60px;align-items:start}
.dname{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(40px,6vw,84px);line-height:.95;letter-spacing:-.04em;margin:22px 0 14px}
.dsub{color:var(--dim);font-weight:300}
.facts{list-style:none;border-top:1px solid var(--hair2)}
.facts li{display:grid;grid-template-columns:160px 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--hair);align-items:baseline}
.facts b{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:19px;letter-spacing:-.01em}
.facts span{color:var(--dim);font-size:14.5px}
@media(max-width:820px){.dir{grid-template-columns:1fr;gap:30px}.facts li{grid-template-columns:120px 1fr}}

/* FOOT */
.foot{border-top:1px solid var(--hair);padding:50px 0 60px;background:#000}
.foot-in{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap}
.flogo{height:22px;width:auto}
.fmeta{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);line-height:1.9;text-align:right;max-width:560px}
.fmeta a{color:var(--dim)}.fmeta a:hover{color:var(--acc)}
@media(max-width:700px){.fmeta{text-align:left}}

/* LIGHTBOX */
#lb{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:16px}
#lb.on{display:flex}
#lb video{width:min(1400px,100%);max-height:84vh;background:#000;border-radius:3px}
#lb .t{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#lb .x{position:absolute;top:16px;right:20px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:none;border:1px solid var(--hair2);padding:9px 14px;border-radius:2px;cursor:pointer}
</style>
</head>

<section id="gate">
  <form class="gbox" id="gform" autocomplete="off">

    <span class="lab">Private · Tender preview</span>
    <h1>The Bird<span class="d">.</span></h1>

</section>
<div id="app"></div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let KEY=null;const cache={};
async function derive(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function unlock(pw){
  const key=await derive(pw);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.ct));
  KEY=key;return new TextDecoder().decode(pt);
}
function media(path){
  if(cache[path])return cache[path];
  const type=path.includes("poster")||/\/a\d/.test(path)?"image/jpeg":"video/mp4";
  return cache[path]=fetch(path).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(buf=>crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},KEY,buf.slice(12))).then(pt=>URL.createObjectURL(new Blob([pt],{type})));
}
function boot(html){
  const app=document.getElementById("app");app.innerHTML=html;document.documentElement.classList.add("open");
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    const el=e.target;
    if(e.isIntersecting){
      if(el.tagName==="IMG"){if(!el.src){media(el.dataset.src).then(u=>{el.src=u;el.onload=()=>el.classList.add("on")}).catch(()=>{})}return}
      const card=el.closest(".film");
      if(!el.src){card&&card.classList.add("loading");media(el.dataset.src).then(u=>{el.src=u;el.play().catch(()=>{});el.classList.add("on");card&&card.classList.remove("loading")}).catch(()=>card&&card.classList.remove("loading"))}
      else el.play().catch(()=>{});
    }else if(el.tagName==="VIDEO"&&el.src){el.pause()}
  }),{rootMargin:"200px 0px"});
  app.querySelectorAll("[data-src]").forEach(el=>io.observe(el));
  const lb=document.getElementById("lb"),lbv=document.getElementById("lbv");
  app.querySelectorAll(".film[data-full]").forEach(c=>c.addEventListener("click",()=>{
    document.getElementById("lbt").innerHTML=c.dataset.title;lb.classList.add("on");
    media(c.dataset.full).then(u=>{lbv.src=u;lbv.muted=false;lbv.currentTime=0;lbv.play().catch(()=>{})});
  }));
  const close=()=>{lb.classList.remove("on");lbv.pause()};
  document.getElementById("lbx").onclick=close;lb.addEventListener("click",e=>{if(e.target===lb)close()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
}
document.getElementById("gform").addEventListener("submit",async e=>{
  e.preventDefault();const pw=document.getElementById("pw").value.trim(),btn=document.getElementById("go"),err=document.getElementById("gerr");
  btn.disabled=true;err.textContent="";
  try{const html=await unlock(pw);try{sessionStorage.setItem("bird_pw",pw)}catch(e){}boot(html)}
  catch(x){err.textContent="Wrong password. Try again."}
  btn.disabled=false;
});
(async()=>{let pw=null;try{pw=sessionStorage.getItem("bird_pw")}catch(e){}if(pw){try{boot(await unlock(pw))}catch(e){}}})();
</script>
